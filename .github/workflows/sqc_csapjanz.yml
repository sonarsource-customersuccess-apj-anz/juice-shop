name: Build
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonar:
    uses: sonarsource-customersuccess-apj-anz/sonar-workflows/.github/workflows/sonar-scan.yml@main
    with:
      project_key: sonarsource-customersuccess-apj-anz_juice-shop
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
